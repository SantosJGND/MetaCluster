[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metagenomics-evaluation-pipeline"
version = "0.1.0"
description = "Benchmark clustering methods for resolving ambiguous taxonomic classifications (Cross-Hits) in metagenomic data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joao Dourado", email = "joao.dourado@insa.min-saude.pt" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.83",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "pandas>=2,<3",
    "pydantic>=2.12",
    "optuna>=4.7",
    "python-dotenv>=1.2",
    "requests>=2.32",
    "networkx>=3.2",
    "plotly>=6.5",
    "scipy>=1.11",
    "joblib>=1.4",
    "xgboost>=2.0,<3.1",
    "ncbi-taxonomist>=1.2",
    "mlflow>=3.10",
    "shap",
]

[tool.setuptools.packages.find]
include = [
    "metagenomics_utils*",
    "classification*",
    "reference_management*",
    "simulate*",
    "clustering*",
    "deployment*",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_ncbi: marks tests that require NCBI API access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["metagenomics_utils", "classification", "reference_management", "simulate", "clustering", "deployment"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
